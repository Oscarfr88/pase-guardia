name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ningún archivo prohibido versionado (audios, exportaciones, modelos, entorno)
        run: node scripts/verificar-repo.mjs
      - run: npm test
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: public/modelos
          key: modelos-${{ hashFiles('modelos.json') }}
      - name: Modelos desde el Release del repo (SHA-256 verificado)
        run: node scripts/obtener-modelos.mjs
      - run: npm run build
      - name: Tamaño del sitio (límite de GitHub Pages)
        run: node scripts/verificar-tamano.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
